services:
  - type: web
    name: loan-processor-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn simple_rag_api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
